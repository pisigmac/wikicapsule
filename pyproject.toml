[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wikicapsule"
version = "0.1.0"
description = "A production-grade MCP server implementing Karpathy's LLM Wiki pattern"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "WikiCapsule Contributors" },
]
keywords = ["mcp", "wiki", "knowledge-base", "llm", "markdown"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "mcp>=1.0.0",
    "gitpython>=3.1.40",
    "pyyaml>=6.0.1",
    "markdown-it-py>=3.0.0",
    "python-frontmatter>=1.0.1",
    "sentence-transformers>=2.2.2",
    "numpy>=1.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
wikicapsule = "wikicapsule.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wikicapsule"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "C4", "SIM"]
ignore = ["D100", "D104", "D107"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/wikicapsule --cov-report=term-missing"
